<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>б-будь ласка сенпай///</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Шо палиш? */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #008080; 
            background-image: radial-gradient(#006666 1px, transparent 1px);
            background-size: 20px 20px;
            user-select: none;
            overflow-x: hidden;
        }

        .win-window {
            background-color: #f0f0f0;
            border: 2px solid #000000;
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.45);
        }

        .win-titlebar {
            background-color: #000000;
            color: #ffffff;
        }

        .win-btn-control {
            width: 36px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s;
        }

        .win-btn-control:hover {
            background-color: #333333;
        }

        .win-btn-close:hover {
            background-color: #e81123;
        }

        .win-input {
            background-color: #ffffff;
            border: 2px solid #7a7a7a;
            border-top-color: #333333;
            border-left-color: #333333;
            outline: none;
            font-family: 'Consolas', 'Courier New', monospace;
            transition: border-color 0.15s;
        }

        .win-input:focus {
            border-color: #0078d7;
            box-shadow: 0 0 0 1px #0078d7;
        }

        .win-button {
            background-color: #e1e1e1;
            border: 2px solid #adadad;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-right-color: #555555;
            border-bottom-color: #555555;
            transition: all 0.1s;
        }

        .win-button:hover {
            background-color: #e5f1fb;
            border-color: #0078d7;
        }

        .win-button:active {
            border-top-color: #555555;
            border-left-color: #555555;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            transform: translate(1px, 1px);
        }

       
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-0.5deg); }
            40% { transform: translateX(8px) rotate(0.5deg); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .shake-anim {
            animation: shake 0.35s ease-in-out;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(420px) rotate(720deg);
                opacity: 0;
            }
        }

        .confetti-piece {
            position: absolute;
            top: -10px;
            width: 10px;
            height: 10px;
            animation: fall linear forwards;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

    <!-- Головне вікно діалогу -->
    <div id="mainWindow" class="win-window w-full max-w-2xl relative overflow-hidden">
        
        <!-- Чорна шапка вікна -->
        <div class="win-titlebar flex items-center justify-between px-2.5 py-1">
            <div class="flex items-center gap-2">
                <!-- Маленька ретро-іконка -->
                <div class="w-4 h-4 bg-pink-300 border border-white flex items-center justify-center text-[10px] font-bold text-black">
                    UwU
                </div>
                <span class="text-xs sm:text-sm tracking-wide font-normal">б-будь ласка сенпай///</span>
            </div>

            <!-- Кнопки керування вікном -->
            <div class="flex items-center -mr-2.5 -my-1">
                <button type="button" onclick="triggerWindowReaction('Куди згортаєш, братику?! >_<')" class="win-btn-control" title="Згорнути">
                    <span class="w-2.5 h-[1px] bg-white block"></span>
                </button>
                <button type="button" onclick="triggerWindowReaction('І так добре видно! ///')" class="win-btn-control" title="Розгорнути">
                    <span class="w-2.5 h-2.5 border border-white block"></span>
                </button>
                <button type="button" onclick="triggerWindowReaction('Н-не закривай мене, сенпай! T_T')" class="win-btn-control win-btn-close" title="Закрити">
                    <svg class="w-3 h-3 stroke-white" viewBox="0 0 12 12" fill="none" stroke-width="1.5">
                        <path d="M2 2L10 10M10 2L2 10" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Спливаюча підказка при кліку на кнопки вікна -->
        <div id="windowTooltip" class="hidden bg-yellow-100 border-b border-black text-black text-xs px-3 py-1.5 text-center font-medium">
        </div>

        <!-- ВКЛАДКА 1: Основне вікно -->
        <div id="prankFormTab" class="p-4 sm:p-6 flex flex-col md:flex-row items-center gap-5 sm:gap-6">
            
            <!-- Ліва частина: Завантажене зображення користувача -->
            <div class="w-44 sm:w-52 flex-shrink-0 flex flex-col items-center justify-center">
                <img
                    src="Anime.jpg"
                    alt="Сенпай"
                    onerror="this.onerror=null; this.src='https://placehold.co/300x460/f0f0f0/333333?text=зображення.jpg';"
                    class="w-full max-h-[340px] object-contain mix-blend-multiply select-none pointer-events-none"
                >
            </div>

            <!-- Права частина: Текст і поля вводу (без тегу form, щоб уникнути закриття вкладки) -->
            <div id="memeForm" class="flex-1 w-full space-y-3.5 text-black">
                <h1 class="text-xl sm:text-2xl font-normal leading-snug text-gray-900">
                    п-покажеш мені деталі своєї карти б-буб ласка?
                </h1>

                <!-- Поле 1: Номер карти -->
                <div>
                    <label for="cardNum" class="block text-sm sm:text-base text-gray-800 mb-1">
                        скажи мені номер своєї карти~
                    </label>
                    <input
                        type="text"
                        id="cardNum"
                        inputmode="numeric"
                        maxlength="19"
                        placeholder="____-____-____-____"
                        autocomplete="off"
                        class="win-input w-full px-2.5 py-1.5 text-base tracking-wider text-gray-900"
                    >
                </div>

                <!-- Поле 2: Термін дії -->
                <div>
                    <label for="cardExp" class="block text-sm sm:text-base text-gray-800 mb-1">
                        а коли вона кінчається? UwU
                    </label>
                    <input
                        type="text"
                        id="cardExp"
                        inputmode="numeric"
                        maxlength="5"
                        placeholder="MM/YY"
                        autocomplete="off"
                        class="win-input w-28 px-2.5 py-1.5 text-base text-center text-gray-900"
                    >
                </div>

                <!-- Поле 3: 3 цифри -->
                <div>
                    <label for="cardCvv" class="block text-sm sm:text-base text-gray-800 mb-1 leading-tight">
                        ці три циферки на обороті...<br>
                        що там пише? я не можу прочитати :(
                    </label>
                    <input
                        type="text"
                        id="cardCvv"
                        inputmode="numeric"
                        maxlength="3"
                        placeholder="***"
                        autocomplete="off"
                        class="win-input w-28 px-2.5 py-1.5 text-base text-center text-gray-900"
                    >
                </div>

                <!-- Кнопка відправки -->
                <div class="pt-2">
                    <button
                        type="button"
                        onclick="revealPrank(event)"
                        class="win-button w-full py-2.5 px-4 text-base sm:text-lg font-medium text-gray-900 cursor-pointer"
                    >
                        арігато сенпай!
                    </button>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА 2: Фінальний екран -->
        <div id="prankRevealTab" class="hidden p-6 sm:p-10 text-center relative min-h-[340px] flex flex-col items-center justify-center bg-[#f0f0f0]">
            <!-- Контейнер для конфетті -->
            <div id="confettiContainer" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

            <div class="relative z-10 max-w-md mx-auto space-y-3">
                <div class="text-5xl sm:text-6xl animate-bounce">
                    ЛОХ
                </div>

                <h2 class="text-3xl sm:text-4xl font-extrabold text-black tracking-tight uppercase bg-yellow-300 border-2 border-black px-4 py-2 shadow-[4px_4px_0px_#000]">
                    ДЯКУЮ
                </h2>

                <p class="text-lg sm:text-xl font-bold text-red-600">
                    (всі гроші тепер у анархіста)
                </p>

                <p class="text-sm sm:text-base font-medium text-gray-800 pt-1">
                    Арігато за довіру, сенпай, 🙈
                </p>

                <div class="bg-white border-2 border-gray-500 p-3 text-xs sm:text-sm text-gray-700 leading-relaxed">
                    🔒 <strong>РОЗУМІЙТЕ:</strong> цифри пішли на благє дєло, не смійте тут вказувати не реальні цифри! СЕМПАЙ, Я Ж ОБРАЖУСЬ НА ТЕБЕ!!
                </div>

                <div class="pt-2">
                    <button
                        type="button"
                        onclick="resetPrank()"
                        class="win-button px-6 py-2.5 text-base font-medium text-black cursor-pointer"
                    >
                        🔄 Спробувати ще раз
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const cardNumInput = document.getElementById('cardNum');
        const cardExpInput = document.getElementById('cardExp');
        const cardCvvInput = document.getElementById('cardCvv');
        const mainWindow = document.getElementById('mainWindow');
        const windowTooltip = document.getElementById('windowTooltip');
        const prankFormTab = document.getElementById('prankFormTab');
        const prankRevealTab = document.getElementById('prankRevealTab');
        const confettiContainer = document.getElementById('confettiContainer');

        // Автоматичне форматування номера картки через дефіс (____-____-____-____)
        cardNumInput.addEventListener('input', (e) => {
            const digits = e.target.value.replace(/\D/g, '').slice(0, 16);
            const parts = digits.match(/.{1,4}/g);
            e.target.value = parts ? parts.join('-') : '';
        });

        // Автоматичне форматування MM/YY
        cardExpInput.addEventListener('input', (e) => {
            const digits = e.target.value.replace(/\D/g, '').slice(0, 4);
            if (digits.length >= 3) {
                e.target.value = digits.slice(0, 2) + '/' + digits.slice(2);
            } else {
                e.target.value = digits;
            }
        });

        // Тільки цифри для 3-значного коду
        cardCvvInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
        });

        // Перехоплення натискання Enter у будь-якому полі вводу без сабміту сторінки
        [cardNumInput, cardExpInput, cardCvvInput].forEach((input) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    e.stopPropagation();
                    revealPrank(e);
                }
            });
        });

        // Реакція вікна при спробі натиснути згорнути/розгорнути/закрити
        let tooltipTimeout;
        function triggerWindowReaction(message) {
            mainWindow.classList.remove('shake-anim');
            void mainWindow.offsetWidth; // Перезапуск CSS-анімації
            mainWindow.classList.add('shake-anim');

            windowTooltip.textContent = message;
            windowTooltip.classList.remove('hidden');

            clearTimeout(tooltipTimeout);
            tooltipTimeout = setTimeout(() => {
                windowTooltip.classList.add('hidden');
            }, 2500);
        }

        // Генерація конфетті для екрану приколу
        function launchConfetti() {
            confettiContainer.innerHTML = '';
            const colors = ['#ff477e', '#ffbe0b', '#3a86ff', '#8338ec', '#06d6a0', '#fb5607'];
            for (let i = 0; i < 45; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (Math.random() * 1.8 + 1.4) + 's';
                piece.style.animationDelay = (Math.random() * 0.4) + 's';
                confettiContainer.appendChild(piece);
            }
        }

        // Показ екрану "ДЯКУЮ ЦЕ ПРИКОЛ!" та миттєве очищення полів
        function revealPrank(event) {
            if (event) event.preventDefault();

            // Миттєво стираємо всі введені символи в пам'яті та DOM
            cardNumInput.value = '';
            cardExpInput.value = '';
            cardCvvInput.value = '';

            windowTooltip.classList.add('hidden');
            prankFormTab.classList.add('hidden');
            prankRevealTab.classList.remove('hidden');

            launchConfetti();
        }

        // Підтримка натискання Enter у полях вводу без перезавантаження/закриття сторінки
        [cardNumInput, cardExpInput, cardCvvInput].forEach((input) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    revealPrank(e);
                }
            });
        });

        // Повернення назад до форми-мему
        function resetPrank() {
            confettiContainer.innerHTML = '';
            prankRevealTab.classList.add('hidden');
            prankFormTab.classList.remove('hidden');
        }
    </script>
</body>
</html>
